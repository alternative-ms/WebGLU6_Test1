<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <!-- ИСПРАВЛЕНИЕ 1: Добавили правильный viewport, чтобы Chrome не зумил страницу -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tetris_Test4</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <!-- ИСПРАВЛЕНИЕ 2: Гарантируем через CSS, что контейнер и canvas займут честные 100% экрана без искажений -->
<style>
  html, body { 
    width: 100%; 
    height: 100%; 
    height: 100dvh; /* Гарантирует точный размер видимой зоны в современных браузерах */
    margin: 0; 
    padding: 0; 
    overflow: hidden; 
    background: #000; 
  }
  #unity-container { 
    width: 100%; 
    height: 100%; 
    height: 100dvh; /* Контейнер принудительно сжимается под рамки браузера */
    position: fixed; /* Заменяем absolute на fixed, чтобы избежать сдвигов при скролле */
    top: 0; 
    left: 0; 
  }
  #unity-canvas { 
    width: 100% !important; 
    height: 100% !important; 
    object-fit: fill; 
  }
</style>

  </head>
  <body>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var buildUrl = "Build/";
      var loaderUrl = buildUrl + "WebGLTechInfoTest1.loader.js";
      var config = {
        dataUrl: buildUrl + "WebGLTechInfoTest1.data.unityweb",
        frameworkUrl: buildUrl + "WebGLTechInfoTest1.framework.js.unityweb",
        codeUrl: buildUrl + "WebGLTechInfoTest1.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "BMLabs",
        productName: "Tetris_Test4",
        productVersion: "1.0"
      };

      // ИСПРАВЛЕНИЕ 3: Переписали кривую мобильную логику Unity
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        
        // Включаем поддержку высокого разрешения экрана (вернет Pixel Perfect)
        config.devicePixelRatio = window.devicePixelRatio || 1; 
        
        // Ограничиваем DPR на слишком «жирных» экранах (опционально, ради экономии батареи/FPS)
        if (config.devicePixelRatio > 2) { config.devicePixelRatio = 2; }
      }
      
      // canvas.style.width и height теперь полностью контролируются CSS выше

      canvas.style.background = "url('" + buildUrl + "/') center / cover";
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      container.addEventListener('mousedown', function(e) {
          e.preventDefault();
      }, false);

      container.oncontextmenu = function(e) {
          e.preventDefault();
      };

// Блокируем стандартный скролл страницы на мобильных устройствах
document.addEventListener('touchmove', function(e) {
    if (e.touches.length > 1) return; // Не ломаем пинч-зум, если он нужен
    e.preventDefault();
}, { passive: false });


    </script>
  </body>
</html>
