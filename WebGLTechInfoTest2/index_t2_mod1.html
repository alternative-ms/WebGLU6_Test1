<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    // Fix 1
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Tetris_Test4</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    // Fix 2-B
    <style>
      html, body { 
        width: 100%; 
        height: 100%; 
        height: 100dvh;
        margin: 0; 
        padding: 0; 
        overflow: hidden; 
      }
      #unity-container { 
        width: 100%; 
        height: 100%; 
        top: 0; 
        left: 0; 
      }
      #unity-canvas { 
        width: 100% !important; 
        height: 100% !important; 
        object-fit: fill; 
      }
    </style>

  </head>


  <body>

    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var buildUrl = "Build/";
      var loaderUrl = buildUrl + "WebGLTechInfoTest2.loader.js";
      var config = {
        dataUrl: buildUrl + "WebGLTechInfoTest2.data.unityweb",
        frameworkUrl: buildUrl + "WebGLTechInfoTest2.framework.js.unityweb",
        codeUrl: buildUrl + "WebGLTechInfoTest2.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "BMLabs",
        productName: "Tetris_Test4",
        productVersion: "1.0"
      };

      // Fix 3-B
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1; 
      }

      canvas.style.background = "url('" + buildUrl + "/') center / cover";
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);

      // ALT-ADDED - Block regular selection on double-click
      container.addEventListener('mousedown', function(e) {
          e.preventDefault();
      }, false);

      // ALT-ADDED - Block context menu
      container.oncontextmenu = function(e) {
          e.preventDefault();
      };


      // Block scroll on mobile
      document.addEventListener('touchmove', function(e) {
          if (e.touches.length > 1) return; // but zoom is possible if needed
          e.preventDefault();
      }, { passive: false });


      function resizeMobileGame() {
          var container = document.querySelector("#unity-container");
          // set valid container size
          container.style.height = window.innerHeight + "px";
      }

      // run size calculation on page load
      resizeMobileGame();

      // recalc size on screen state update
      window.addEventListener('resize', resizeMobileGame);
      window.addEventListener('orientationchange', resizeMobileGame);

    </script>
  </body>
</html>
